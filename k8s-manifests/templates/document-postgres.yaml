apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-postgres-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.documentPostgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: document-postgres
  template:
    metadata:
      labels:
        app: document-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.documentPostgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.documentPostgres.db }}
            - name: POSTGRES_USER
              value: {{ .Values.documentPostgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: document-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.documentPostgres.user | quote }}, "-d", {{ .Values.documentPostgres.db | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.documentPostgres.user | quote }}, "-d", {{ .Values.documentPostgres.db | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: document-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: document-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: document-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.documentService.replicas }}
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
        - name: document-service
          image: "{{ .Values.documentService.image.repository }}:{{ .Values.documentService.image.tag }}"
          imagePullPolicy: {{ .Values.documentService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.documentService.port }}
          env:
            - name: DB_HOST
              value: document-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.documentPostgres.db }}
            - name: DB_USER
              value: {{ .Values.documentPostgres.user }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: document-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.documentService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.documentService.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.documentService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: document-service
  ports:
    - port: {{ .Values.documentService.port }}
      targetPort: {{ .Values.documentService.port }}
  type: ClusterIP
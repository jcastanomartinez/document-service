apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.containerPort }}
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8081"
            - name: FACTURACION_SERVICE_URL
              value: "http://facturacion-service:8082"
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.apiGateway.serviceType }}
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.servicePort }}
      targetPort: {{ .Values.apiGateway.containerPort }}
      nodePort: {{ .Values.apiGateway.nodePort }}
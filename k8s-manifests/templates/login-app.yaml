apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-app
  namespace: {{ .Release.Namespace }}
  labels:
    app: login-app
spec:
  replicas: {{ .Values.loginApp.replicas }}
  selector:
    matchLabels:
      app: login-app
  template:
    metadata:
      labels:
        app: login-app
    spec:
      containers:
        - name: login-app
          image: "{{ .Values.loginApp.image.repository }}:{{ .Values.loginApp.image.tag }}"
          imagePullPolicy: {{ .Values.loginApp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.loginApp.containerPort }}
          resources:
            {{- toYaml .Values.loginApp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: angular-frontend-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.loginApp.serviceType }}
  ports:
    - port: {{ .Values.loginApp.servicePort }}
      targetPort: {{ .Values.loginApp.containerPort }}
      protocol: TCP
      nodePort: {{ .Values.loginApp.nodePort }}
  selector:
    app: login-app